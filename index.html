<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Próba Brokka</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #f3f4f6; font-family: system-ui, sans-serif; }
  .card { margin: 24px auto 0; width: 320px; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: #555; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 16px; }
</style>
</head>
<body>
  <main class="card" id="card">
    <h1>Witaj w próbie</h1>
    <p>Ta karta ma być na środku ekranu.</p>
    <button>Dalej</button>
  </main>
</body>
</html>
